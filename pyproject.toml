[project]
name = "inoue"
version = "0.1.0"
authors = [{ name = "karin0", email = "karin0@gmx.com" }]
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
    "simpleeval>=1.0.3",
    "python-telegram-bot[http2]>=22",
    "prettytable>=3.17.0",
    "yt-dlp>=2026.3.17",
    "pathvalidate>=3.3.1",
    "pillow>=10.0.0",
    "rembg[cpu]>=2.0.75",
    "ptbcontrib",
    "aiohttp>=3.13.5",
]
optional-dependencies = { regex = ["regex>=2026.4.4"] }

[tool.uv.sources]
ptbcontrib = { git = "https://github.com/python-telegram-bot/ptbcontrib.git", rev = "main" }

[dependency-groups]
dev = [
    "objgraph>=3.6.2",
    "ruff>=0.15.12",
    "black>=26.3.1",
    "pyright>=1.1.409",
    "pyinstrument>=5.1.2",
]
