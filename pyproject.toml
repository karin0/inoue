[project]
name = "inoue"
version = "0.1.0"
authors = [{ name = "karin0", email = "karin0@gmx.com" }]
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
    "simpleeval>=1.0.3",
    "python-telegram-bot>=22.8",
    "prettytable>=3.17.0",
    "yt-dlp>=2026.3.17",
    "pathvalidate>=3.3.1",
    "pillow>=13.0.0",
    "rembg[cpu]>=2.0.86",
    "ptbcontrib",
    "aiohttp>=3.14.4",
    "regex>=2026.4.4",
]

[project.optional-dependencies]
og = ["objgraph>=3.6.2"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pyright>=1.1.409",
    "pyinstrument>=5.1.2",
    "pytest>=9.0.3",
]

[tool.uv.sources]
ptbcontrib = { git = "https://github.com/python-telegram-bot/ptbcontrib", rev = "3fccff10526d19a21f595a23529102a1dd13f976" }

[tool.uv]
exclude-newer = "15 days"
# Pillow 13.0.0 fixes 24 CVEs in decoding images, and the bot opens images from chats.
# rembg 2.0.86 is the first release accepting Pillow 13.
exclude-newer-package = { pillow = "2026-10-17T00:00:00Z", rembg = "2026-10-22T00:00:00Z" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A",
    "ANN",
    "ARG",
    "CPY",
    "D",
    "EM",
    "ERA",
    "FAST",
    "FBT",
    "PTH",
    "COM812",

    "B020",
    "BLE001",
    "DTZ005",
    "DTZ006",
    "FBT001",
    "N818",
    "PLC0415",
    "PLW0603",
    "PLW1508",
    "PLW2901",
    "RET503",
    "RUF021",
    "RUF022",
    "RUF023",
    "SLF001",
    "TC001",
    "TC002",
    "TC006",
    "TRY003",
    "TRY004",

    "TD",
    "PLR",
    "ASYNC230",
    "ASYNC240",
    "C901",
    "FIX003",
    "S101",
    "S311",
]

[tool.ruff.lint.per-file-ignores]
"*/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.isort]
lines-between-types = 1
